services:
  nginx-bootstrap:
    profiles: [tls-bootstrap]
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports: ['80:80']
    environment:
      PCC_DOMAIN: ${PCC_DOMAIN:-pcc.example.invalid}
      NGINX_ENVSUBST_FILTER: PCC_DOMAIN
    volumes:
      - ./infra/nginx/bootstrap.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
